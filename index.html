    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #8cc63f;
      }

      /* Evitar flash negro en dark mode antes de que cargue React */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #8cc63f;
        }
      }

      #root {
        min-height: 100%;
        min-height: 100dvh;
        width: 100%;
      }

      #static-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        background: #8cc63f;
        opacity: 1;
        transition: opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }

      #static-splash.is-dismissed {
        opacity: 0;
      }

      #static-splash img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      #static-splash-status {
        position: absolute;
        left: 0;
        right: 0;
        bottom: max(2.5rem, calc(env(safe-area-inset-bottom) + 1.5rem));
        margin: 0;
        padding: 0 1.5rem;
        text-align: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.88);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.2);
      }
    </style>

  <body>
    <div id="static-splash" aria-live="polite" aria-busy="true" role="status">
      <img
        src="/assets/splash/splash-screen.png"
        alt=""
        width="1080"
        height="1920"
        decoding="async"
        fetchpriority="high"
      />
      <p id="static-splash-status">Cargando…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
